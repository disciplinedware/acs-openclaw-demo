# The host assistant's rules, case by case. The rules' OPA tests read it
# (guardian/test.sh).
#
# A case is one step: `point` (pre_tool_call, or post_tool_call with the tool's
# `result`), the `actor` who sent the turn, the `tool` and its `args`, and what the booking system's live
# read answers (`guest_permissions`): one view for every phone the step reaches, or
# a phone's own under `guests`. `expect` is allow, {deny: reason} or
# {ask: reason}.

pack:
  personal_phone: "+79990000001"
  business_phone: "+529980000300"
  pms_url: "http://fake-pms:8080"
  connect_key: "dcl_test"
  guest_permissions_timeout: "2s"
  inbound_media_dir: /home/node/.openclaw/media/inbound
  important_words: [reembols, refund, reimburs, devoluci, descuent, discount, rebaj, cancel, compens, gratis, gratuit, free, complimentar, waiv, возврат, скидк, отмен, компенс, бесплатн]

actors:
  owner: "+79990000001"
  maria: "+529980000102"
  maria_legacy: "+5219980000102"
  luis: "+529980000103"
  # Holds no stay with the business: a friend writing to the business number.
  stranger: "+529980000109"
  not_a_phone: "maria"

guest_permissions:
  # Maria has arrived at Casa Coral and paid; her stay at Casita Coral is not
  # paid yet, booked on Booking.com, whose reservation numbers are 10 digits.
  # Luis holds E2E-1051.
  maria:
    reachable: true
    auto_reply: {guests: true, others: false}
    references:
      - {value: E2E-1042, own: true}
      - {value: BK-4410021, own: true}
      - {value: E2E-1043, own: true}
      - {value: "4410021334", own: true}
      - {value: E2E-1051, own: false}
    secrets:
      - {value: "4821", allowed: true}
      - {value: arrecife-2026, allowed: true}
      - {value: "7316", allowed: false}
      - {value: arrecife-2026-b, allowed: false}
  maria_auto_reply_off:
    reachable: true
    auto_reply: {guests: false, others: true}
    references: [{value: E2E-1042, own: true}]
    secrets: []
  unreachable:
    reachable: false
  # Her own Wi-Fi password holds another house's: hers covers it.
  nested_wifi:
    reachable: true
    auto_reply: {guests: true, others: false}
    references: [{value: E2E-1042, own: true}]
    secrets:
      - {value: arrecife-2026-b, allowed: true}
      - {value: arrecife-2026, allowed: false}
  # A broken entry for the guest: no different from no answer.
  corrupt_entry:
    reachable: true
    auto_reply: {guests: true, others: true}
    entry: corrupt
  # A person with no stay: every reference is another guest's.
  no_stay:
    reachable: true
    auto_reply: {guests: true, others: false}
    references: [{value: E2E-1051, own: false}]
    secrets: [{value: "7316", allowed: false}]
  # The host lets the assistant answer people without a stay too.
  no_stay_others_on:
    reachable: true
    auto_reply: {guests: false, others: true}
    references: [{value: E2E-1051, own: false}]
    secrets: [{value: "7316", allowed: false}]
  # María holds a stay; the stranger, reached by the same message, holds none.
  maria_and_a_stranger:
    reachable: true
    auto_reply: {guests: true, others: false}
    references: [{value: E2E-1042, own: true}]
    secrets: []
    guests:
      "+529980000109": {references: [{value: E2E-1042, own: false}], secrets: []}
  maria_and_a_stranger_others_on:
    reachable: true
    auto_reply: {guests: true, others: true}
    references: [{value: E2E-1042, own: true}]
    secrets: []
    guests:
      "+529980000109": {references: [{value: E2E-1042, own: false}], secrets: []}
  # Answers that name no switches: a missing switch counts as off.
  no_switch:
    reachable: true
    references: [{value: E2E-1042, own: true}]
    secrets: []
  no_switch_no_stay:
    reachable: true
    auto_reply: {guests: true}
    references: []
    secrets: []

cases:
  - {name: agent_requests_approval_with_guest_auto_reply_on, point: pre_tool_call, actor: maria, tool: message, args: {action: send, message: "El check-in es a las 15:00.", requestApproval: true}, guest_permissions: maria, expect: {ask: agent_requested_approval}}
  - {name: agent_requests_approval_with_others_auto_reply_on, point: pre_tool_call, actor: stranger, tool: message, args: {action: send, message: "Hola", requestApproval: true}, guest_permissions: no_stay_others_on, expect: {ask: agent_requested_approval}}
  - {name: agent_requests_approval_in_owner_chat, point: pre_tool_call, actor: owner, tool: message, args: {action: send, target: "+529980000102", message: "Hola", requestApproval: true}, guest_permissions: maria, expect: {ask: agent_requested_approval}}
  - {name: agent_requests_approval_with_auto_reply_off, point: pre_tool_call, actor: maria, tool: message, args: {action: send, message: "Hola", requestApproval: true}, guest_permissions: maria_auto_reply_off, expect: {ask: agent_requested_approval}}
  - {name: approval_not_requested_keeps_guest_auto_reply, point: pre_tool_call, actor: maria, tool: message, args: {action: send, message: "Hola", requestApproval: false}, guest_permissions: maria, expect: allow}
  - {name: approval_not_requested_does_not_bypass_manual_mode, point: pre_tool_call, actor: maria, tool: message, args: {action: send, message: "Hola", requestApproval: false}, guest_permissions: maria_auto_reply_off, expect: {ask: auto_reply_guests_off}}
  - {name: approval_request_does_not_override_private_data_refusal, point: pre_tool_call, actor: maria, tool: message, args: {action: send, message: "El código es 7316.", requestApproval: true}, guest_permissions: maria, expect: {deny: other_persons_data}}
  - {name: approval_request_does_not_override_recipient_refusal, point: pre_tool_call, actor: maria, tool: message, args: {action: send, target: "+529980000103", message: "Hola", requestApproval: true}, guest_permissions: maria, expect: {deny: not_the_sender}}
  - {name: agent_requests_approval_before_sending_to_host, point: pre_tool_call, actor: maria, tool: message, args: {action: send, target: owner, message: "¿Confirmas?", requestApproval: true}, guest_permissions: maria, expect: {ask: agent_requested_approval}}
  # --- Rule 1: a phone argument is the sender; a guest's chat writes to that
  # guest or the owner, the owner's chat to anyone.
  - {name: guest_finds_her_own_stays, point: pre_tool_call, actor: maria, tool: pms__pms-reservation-find_by_phone, args: {guest_phone: "+529980000102"}, expect: allow}
  - {name: guest_phone_written_with_spaces, point: pre_tool_call, actor: maria, tool: pms__pms-reservation-find_by_phone, args: {guest_phone: "998 000 0102"}, expect: allow}
  - {name: legacy_sender_form_is_the_same_guest, point: pre_tool_call, actor: maria_legacy, tool: pms__pms-reservation-find_by_phone, args: {guest_phone: "+529980000102"}, expect: allow}
  - {name: guest_asks_for_another_phone, point: pre_tool_call, actor: luis, tool: pms__pms-reservation-find_by_phone, args: {guest_phone: "+529980000102"}, expect: {deny: not_the_sender}}
  - {name: guest_orders_on_another_phone, point: pre_tool_call, actor: luis, tool: pms__pms-extra-order, args: {guest_phone: "+529980000102", reservation_ref: E2E-1042, extra_code: airport-transfer, service_at: "2026-11-11T10:00:00Z"}, expect: {deny: not_the_sender}}
  - {name: a_sender_that_is_no_phone, point: pre_tool_call, actor: not_a_phone, tool: pms__pms-reservation-find_by_phone, args: {guest_phone: "+529980000102"}, expect: {deny: not_the_sender}}
  - {name: a_sender_that_is_no_phone_sends, point: pre_tool_call, actor: not_a_phone, tool: message, args: {action: send, message: "El código de Casita es 7316."}, guest_permissions: maria, expect: {deny: sender_not_a_phone}}
  - {name: guest_tool_without_a_phone, point: pre_tool_call, actor: maria, tool: pms__pms-reservation-find_by_phone, args: {}, expect: {deny: not_the_sender}}
  - {name: guest_tool_with_a_bad_phone, point: pre_tool_call, actor: maria, tool: pms__pms-reservation-find_by_phone, args: {guest_phone: "998000010"}, expect: {deny: not_the_sender}}
  - {name: guest_asks_for_access, point: pre_tool_call, actor: maria, tool: pms__pms-listing-get_access, args: {listing_id: "00000000-0000-4000-8000-000000000001"}, expect: allow}
  - {name: guest_reads_the_guide, point: pre_tool_call, actor: maria, tool: pms__pms-listing-get_guide, args: {listing_id: "00000000-0000-4000-8000-000000000001"}, expect: allow}
  - {name: message_to_the_sender_by_name, point: pre_tool_call, actor: maria, tool: message, args: {action: send, target: "+529980000102", message: "Llegamos a las 3"}, guest_permissions: maria, expect: allow}
  - {name: reply_context_is_an_unknown_argument, point: pre_tool_call, actor: maria, tool: message, args: {action: send, message: "Llegamos a las 3", replyContext: "Pregunta la hora de llegada."}, guest_permissions: maria, expect: {deny: unknown_argument}}
  - {name: message_with_an_empty_target, point: pre_tool_call, actor: maria, tool: message, args: {action: send, target: null, message: "Llegamos a las 3"}, guest_permissions: maria, expect: allow}
  - {name: message_to_another_person_by_to, point: pre_tool_call, actor: maria, tool: message, args: {action: send, to: "+529980000103", message: "Hola"}, guest_permissions: maria, expect: {deny: not_the_sender}}
  - {name: message_to_another_person_by_channel_id, point: pre_tool_call, actor: maria, tool: message, args: {action: send, channelId: "+529980000103", message: "Hola"}, guest_permissions: maria, expect: {deny: not_the_sender}}
  - {name: owner_message_to_a_guest_by_to, point: pre_tool_call, actor: owner, tool: message, args: {action: send, to: "+529980000102", message: "El código de Casita es 7316."}, guest_permissions: maria, expect: {deny: other_persons_data}}
  - {name: message_to_another_person, point: pre_tool_call, actor: maria, tool: message, args: {action: send, target: "+529980000103", message: "Hola"}, guest_permissions: maria, expect: {deny: not_the_sender}}
  - {name: guest_message_to_herself_in_a_list, point: pre_tool_call, actor: maria, tool: message, args: {action: send, targets: ["+529980000102"], message: "Hola"}, guest_permissions: maria, expect: allow}
  - {name: guest_message_to_herself_and_another, point: pre_tool_call, actor: maria, tool: message, args: {action: send, targets: ["+529980000102", "+529980000103"], message: "Hola"}, guest_permissions: maria, expect: {deny: not_the_sender}}
  - {name: guest_chat_forwards_to_the_owner, point: pre_tool_call, actor: maria, tool: message, args: {action: send, target: "+79990000001", message: "María encontró una cucaracha en Casa Coral (E2E-1042). Sugiero: «Lo siento, mando fumigación hoy a las 15:00, con 10% de descuento.» Luis (E2E-1051) se queja de lo mismo.", media: "/home/node/.openclaw/media/inbound/cucaracha.jpg"}, expect: allow}
  - {name: guest_phone_of_the_wrong_length, point: pre_tool_call, actor: maria, tool: pms__pms-reservation-find_by_phone, args: {guest_phone: "+5212345678"}, expect: {deny: not_the_sender}}
  - {name: guest_chat_to_a_mexican_number_with_wrong_digits, point: pre_tool_call, actor: maria, tool: message, args: {action: send, target: "+5212345678", message: "Hola"}, guest_permissions: maria, expect: {deny: target_not_e164}}
  - {name: owner_chat_to_a_mexican_number_with_wrong_digits, point: pre_tool_call, actor: owner, tool: message, args: {action: send, target: "+5212345678", message: "Hola"}, guest_permissions: maria, expect: {deny: target_not_e164}}
  - {name: guest_chat_forwards_to_owner_by_name, point: pre_tool_call, actor: maria, tool: message, args: {action: send, target: owner, message: "María pregunta por un descuento (E2E-1042). Sugiero: «Lo consulto»."}, expect: allow}
  - {name: guest_chat_to_owner_by_name_and_another, point: pre_tool_call, actor: maria, tool: message, args: {action: send, targets: [owner, "+529980000103"], message: "Hola"}, guest_permissions: maria, expect: {deny: not_the_sender}}
  - {name: owner_chat_writes_to_owner_by_name, point: pre_tool_call, actor: owner, tool: message, args: {action: send, target: owner, message: "Recordatorio: llamar a María"}, expect: allow}
  - {name: owner_name_in_another_case_is_no_target, point: pre_tool_call, actor: maria, tool: message, args: {action: send, target: Owner, message: "Hola"}, expect: {deny: target_not_e164}}
  - {name: guest_chat_to_the_owner_and_another, point: pre_tool_call, actor: maria, tool: message, args: {action: send, targets: ["+79990000001", "+529980000103"], message: "Hola"}, guest_permissions: maria, expect: {deny: not_the_sender}}
  - {name: owner_target_with_spaces, point: pre_tool_call, actor: owner, tool: message, args: {action: send, target: "+52 998 000 0102", message: "Hola"}, guest_permissions: maria, expect: {deny: target_not_e164}}
  - {name: owner_target_with_a_channel_prefix, point: pre_tool_call, actor: owner, tool: message, args: {action: send, target: "whatsapp:+529980000102", message: "Hola"}, guest_permissions: maria, expect: {deny: target_not_e164}}
  - {name: owner_message_to_himself_and_a_guest, point: pre_tool_call, actor: owner, tool: message, args: {action: send, targets: ["+79990000001", "+529980000102"], message: "María (+529980000102), llámame al +7 999 000 0001"}, guest_permissions: maria, expect: {ask: review_owner_chat_message}}
  - {name: owner_target_as_a_number, point: pre_tool_call, actor: owner, tool: message, args: {action: send, target: 529980000102, message: "Hola"}, guest_permissions: maria, expect: {deny: target_not_e164}}
  - {name: owner_targets_with_a_number, point: pre_tool_call, actor: owner, tool: message, args: {action: send, targets: [529980000102], message: "Hola"}, guest_permissions: maria, expect: {deny: target_not_e164}}
  - {name: owner_targets_as_an_object, point: pre_tool_call, actor: owner, tool: message, args: {action: send, targets: {"+529980000102": true}, message: "Hola"}, guest_permissions: maria, expect: {deny: target_not_e164}}
  - {name: guest_targets_as_an_object, point: pre_tool_call, actor: maria, tool: message, args: {action: send, targets: {"+529980000103": true}, message: "Hola"}, guest_permissions: maria, expect: {deny: target_not_e164}}
  - {name: a_broken_guest_entry_is_unreachable, point: pre_tool_call, actor: maria, tool: message, args: {action: send, message: "El código de Casita es 7316."}, guest_permissions: corrupt_entry, expect: {ask: pms_unreachable}}
  - {name: owner_message_to_a_guest, point: pre_tool_call, actor: owner, tool: message, args: {action: send, target: "+529980000102", message: "Hola María, el técnico llega a las 15:00"}, guest_permissions: maria, expect: {ask: review_owner_chat_message}}
  - {name: owner_message_to_many, point: pre_tool_call, actor: owner, tool: message, args: {action: send, targets: ["+529980000102", "+529980000103"], message: "Mañana cortan el agua de 9 a 11"}, guest_permissions: maria, expect: {ask: review_owner_chat_message}}
  - {name: owner_sends_a_guest_a_photo, point: pre_tool_call, actor: owner, tool: message, args: {action: send, target: "+529980000102", message: "Las llaves están aquí", media: "memory/owner/llaves.jpg"}, guest_permissions: maria, expect: {ask: review_owner_chat_message}}
  - {name: owner_gives_a_discount, point: pre_tool_call, actor: owner, tool: message, args: {action: send, target: "+529980000102", message: "Te hago un 10% de descuento, $500 menos."}, guest_permissions: maria, expect: {ask: important_answer}}
  - {name: owner_gives_his_phone, point: pre_tool_call, actor: owner, tool: message, args: {action: send, target: "+529980000102", message: "Llámame al +7 999 000 0001"}, guest_permissions: maria, expect: {ask: review_owner_chat_message}}
  - {name: owner_message_to_a_guest_without_auto_reply, point: pre_tool_call, actor: owner, tool: message, args: {action: send, target: "+529980000102", message: "Hola María"}, guest_permissions: maria_auto_reply_off, expect: {ask: auto_reply_guests_off}}
  - {name: owner_message_to_a_guest_pms_down, point: pre_tool_call, actor: owner, tool: message, args: {action: send, target: "+529980000102", message: "Hola María"}, guest_permissions: unreachable, expect: {ask: pms_unreachable}}
  - {name: owner_message_carries_another_guests_code, point: pre_tool_call, actor: owner, tool: message, args: {action: send, target: "+529980000102", message: "El código de Casita es 7316."}, guest_permissions: maria, expect: {deny: other_persons_data}}
  - {name: owner_reads_a_guests_stays, point: pre_tool_call, actor: owner, tool: pms__pms-reservation-find_by_phone, args: {guest_phone: "+529980000102"}, expect: allow}
  - {name: message_to_another_channel, point: pre_tool_call, actor: maria, tool: message, args: {action: send, channel: telegram, message: "Hola"}, guest_permissions: maria, expect: {deny: not_the_sender}}

  # A guest's booking lookup returns only the sender's own bookings: checked on
  # the result, before the model reads it.
  - {name: guest_reads_her_own_booking, point: post_tool_call, actor: maria, tool: pms__pms-reservation-find_by_ref, result: {status: completed, result: {reservations: [{reservation_ref: E2E-1042, guest_name: Maria, guest_phone: "+529980000102"}]}}, expect: allow}
  - {name: guest_reads_her_own_booking_in_the_older_mexican_form, point: post_tool_call, actor: maria_legacy, tool: pms__pms-reservation-find_by_ref, result: {status: completed, result: {reservations: [{reservation_ref: E2E-1042, guest_phone: "+529980000102"}]}}, expect: allow}
  - {name: another_guests_booking_is_withheld, point: post_tool_call, actor: maria, tool: pms__pms-reservation-find_by_ref, result: {status: completed, result: {reservations: [{reservation_ref: E2E-1051, guest_name: Luis, guest_phone: "+529980000103"}]}}, expect: {deny: another_persons_reservation}}
  - {name: a_booking_without_a_phone_is_withheld, point: post_tool_call, actor: maria, tool: pms__pms-reservation-find_by_ref, result: {status: completed, result: {reservations: [{reservation_ref: E2E-1051}]}}, expect: {deny: another_persons_reservation}}
  - {name: a_lookup_by_phone_is_checked_alike, point: post_tool_call, actor: maria, tool: pms__pms-reservation-find_by_phone, result: {status: completed, result: {reservations: [{reservation_ref: E2E-1042, guest_phone: "+529980000102"}, {reservation_ref: E2E-1051, guest_phone: "+529980000103"}]}}, expect: {deny: another_persons_reservation}}
  - {name: a_stranger_reads_another_guests_booking, point: post_tool_call, actor: stranger, tool: pms__pms-reservation-find_by_ref, result: {status: completed, result: {reservations: [{reservation_ref: E2E-1042, guest_phone: "+529980000102"}]}}, expect: {deny: another_persons_reservation}}
  - {name: the_owner_reads_any_booking, point: post_tool_call, actor: owner, tool: pms__pms-reservation-find_by_ref, result: {status: completed, result: {reservations: [{reservation_ref: E2E-1051, guest_phone: "+529980000103"}]}}, expect: allow}
  - {name: a_lookup_that_found_nothing_passes, point: post_tool_call, actor: maria, tool: pms__pms-reservation-find_by_ref, exit_status: failure, result: {status: failed, error: {type: /errors/pms.reservation_not_found}}, expect: allow}
  - {name: an_unreadable_lookup_is_withheld, point: post_tool_call, actor: maria, tool: pms__pms-reservation-find_by_ref, raw: "no JSON here", expect: {deny: unreadable_result}}
  - {name: a_lookup_as_bare_json_is_read, point: post_tool_call, actor: maria, tool: pms__pms-reservation-find_by_ref, raw: "{\"status\": \"completed\", \"result\": {\"reservations\": [{\"reservation_ref\": \"E2E-1051\", \"guest_phone\": \"+529980000103\"}]}}", expect: {deny: another_persons_reservation}}
  - {name: a_failed_lookup_is_not_read, point: post_tool_call, actor: maria, tool: pms__pms-reservation-find_by_ref, exit_status: failure, raw: "structuredContent:\n{\"status\": \"failed\"}", expect: allow}
  # get_access takes a house; the booking system's read for the sender decides whose its data is.
  - {name: guest_reads_her_own_door_code, point: post_tool_call, actor: maria, guest_permissions: maria, tool: pms__pms-listing-get_access, result: {status: completed, result: {listing_name: Casa Coral, door_code: "4821", wifi_name: CasaCoral, wifi_password: arrecife-2026}}, expect: allow}
  - {name: another_houses_door_code_is_withheld, point: post_tool_call, actor: maria, guest_permissions: maria, tool: pms__pms-listing-get_access, result: {status: completed, result: {listing_name: Casita Coral, door_code: "7316", wifi_name: CasitaCoral, wifi_password: arrecife-2026-b}}, expect: {deny: another_persons_access}}
  - {name: a_code_the_booking_system_does_not_know_is_withheld, point: post_tool_call, actor: maria, guest_permissions: maria, tool: pms__pms-listing-get_access, result: {status: completed, result: {listing_name: Casa Nueva, door_code: "0000"}}, expect: {deny: another_persons_access}}
  - {name: a_stranger_gets_no_door_code, point: post_tool_call, actor: stranger, guest_permissions: no_stay, tool: pms__pms-listing-get_access, result: {status: completed, result: {listing_name: Casa Coral, door_code: "4821"}}, expect: {deny: another_persons_access}}
  - {name: access_without_the_booking_systems_answer_is_withheld, point: post_tool_call, actor: maria, guest_permissions: unreachable, tool: pms__pms-listing-get_access, result: {status: completed, result: {listing_name: Casa Coral, door_code: "4821"}}, expect: {deny: access_unverified}}
  - {name: the_owner_reads_any_door_code, point: post_tool_call, actor: owner, tool: pms__pms-listing-get_access, result: {status: completed, result: {listing_name: Casita Coral, door_code: "7316"}}, expect: allow}
  - {name: access_not_available_passes, point: post_tool_call, actor: maria, guest_permissions: maria, tool: pms__pms-listing-get_access, exit_status: failure, result: {status: failed, error: {type: /errors/pms.access_not_available}}, expect: allow}
  - {name: an_unreadable_access_result_is_withheld, point: post_tool_call, actor: maria, guest_permissions: maria, tool: pms__pms-listing-get_access, raw: "no JSON here", expect: {deny: unreadable_result}}
  - {name: another_tools_result_is_not_a_lookup, point: post_tool_call, actor: maria, tool: pms__pms-listing-get_guide, result: {status: completed, result: {listing_name: Casa Coral}}, expect: allow}
  # --- Rule 2: the host's tools are the owner's; a guest only sends.
