# The Go Guardian's configuration for Casa Coral's host assistant. Mounted at
# /deployment in the acs-guardian container; paths are relative to it, except
# the ones the container image owns.
server:
  host: 0.0.0.0
  port: "8787"
  read_header_timeout: 10s
  read_timeout: 30s
  write_timeout: 30s
  idle_timeout: 2m
  shutdown_grace: 10s

policy:
  deployment_dir: .
  manifest: policy/manifest.yaml
  mapping: mapping.yaml
  evaluator: agt
  opa_path: /app/opa
  opa_timeout: 4s
  # An ASK goes to the ACS adapter unchanged, naming the owner as approver;
  # the adapter puts it to the owner (openclaw.template.json, approvers).
  ask_substitution: none
  ask_approver: {type: human, id: owner}

security:
  hmac_key_id: pms-concierge
  hmac_secret_file: /run/secrets/acs-hmac

storage:
  provider: memory

audit:
  envelope_log: /data/envelopes.jsonl
  event_log: /data/events.jsonl
  max_queue_records: 4096
  max_queue_bytes: 67108864 # 64 MiB of records waiting for a stalled disk

protocol:
  on_decision_failure: deny
  decision_timeout: 5s
  answer_margin: 500ms # of decision_timeout, kept to record, sign and send the answer
  skew_window: 5m

limits:
  max_sessions: 1024
  max_entries: 10000
  max_reservations: 20000
  max_skill_approvals: 4096
  max_engine_calls: 256
  max_policy_state_bytes: 65536
  max_body_bytes: 1048576
  max_deferrals: 3
  session_retention: 24h
